services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: newsrag-postgres
    restart: always
    environment:
      POSTGRES_USER: newsrag
      POSTGRES_PASSWORD: newsrag
      POSTGRES_DB: newsrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
